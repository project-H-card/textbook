<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{名前ルビなし} | ハイスト人物図鑑</title>
    <link rel="stylesheet" href="../../css/textbook/gegw_common.css">
    <link rel="stylesheet" href="../../css/textbook/gegw_spot.css">
</head>

<body>
    <main>
        <div class="pages" data-name="{名前ルビなし}.png">
            <div class="innerFrame"></div>
            <div class="mainFrame"></div>
        
            <div class="sidebar">
                <div class="sidebarMargin"></div>
                <div class="sidebarMain">
                    <img src="../../assets/images/textbook/sidebar/西軍.webp" alt="西軍">
                </div>
            </div>
        
            <div class="page leftPage">
                <div class="topBlack">
                    <h2>
                        <span class="small"><ruby>岐阜<rt>ぎふ</rt></ruby>の<ruby>名所紹介<rt>めいしょしょうかい</rt></ruby></span>
                        <span class="big">{場所名}</span>
                    </h2>
                </div>
                <div class="middleImage">
                    <img class="middleImageMain" src="../../assets/images/textbook/gegw/place/{場所名ルビなし}.webp" alt="">
                    <img class="middleImageMini left" src="../../assets/images/textbook/gegw/map/{場所名ルビなし}.webp" alt="">
                </div>
                <div class="pageMain">
                    <div class="mainLeft">
                        <img class="mainLeftImage" src="../../assets/images/textbook/large_illust/gegw/original/{紹介キャラ画像}.webp" alt="">
                        <div class="mainCharacter">
                            <span class="small">{紹介キャラ異名}</span>
                            <span class="big">{紹介キャラ名}</span>
                        </div>
                    </div>
                    <div class="mainRight">
                        <h2 class="sectionTitle">{場所詳細}</h2>
                        <p>{紹介内容}</p>
                    </div>
                </div>
            </div>
        
        
            <div class="page rightPage">
                <!-- <div class="deckTitle">
                    <img src="../../assets/images/textbook/gegw/deck_title.webp" alt="">
                </div> -->
                <div class="topBlack">
                    <h2>
                        <span class="small"><ruby>岐阜<rt>ぎふ</rt></ruby>の<ruby>名所紹介<rt>めいしょしょうかい</rt></ruby></span>
                        <span class="big">{場所名右}</span>
                    </h2>
                </div>
                <div class="middleImage">
                    <img class="middleImageMain" src="../../assets/images/textbook/gegw/place/{場所名右ルビなし}.webp" alt="">
                    <img class="middleImageMini right" src="../../assets/images/textbook/gegw/map/{場所名右ルビなし}.webp" alt="">
                </div>
                <div class="pageMain">
                    <div class="mainLeft">
                        <img class="mainLeftImage" src="../../assets/images/textbook/large_illust/gegw/original/{紹介キャラ画像右}.webp" alt="">
                        <div class="mainCharacter">
                            <span class="small">{紹介キャラ異名右}</span>
                            <span class="big">{紹介キャラ名右}</span>
                        </div>
                    </div>
                    <div class="mainRight">
                        <h2 class="sectionTitle">{場所詳細右}</h2>
                        <p>{紹介内容右}</p>
                    </div>
                </div>
        
                
            </div>
            <div class="sidebar">
                <div class="sidebarMain">
                    <img src="../../assets/images/textbook/sidebar/東軍.webp" alt="東軍">
                </div>
                <div class="sidebarMargin"></div>
            </div>
        </div>
    </main>
    <script>
        const images = document.querySelectorAll('img');
        images.forEach(img => {
            img.addEventListener('error', () => {
                console.log(img.src);
                img.src = '../../assets/images/textbook/common/errorGreen.webp';
            });

            // テンプレートでui を確かめるためにエラーを出力
            img.src = '../../assets/images/textbook/common/errorGreen.webp';
        });

        

        // 東軍だったらsidebarのclassにeastを追加
        const sidebars = document.querySelectorAll(".sidebar");
        sidebars.forEach(sidebar => {
            const alt = sidebar.querySelector("img").alt;
            if (alt.includes("東軍")) {
                sidebar.classList.add("east");
            }
        });


        // .big と .sectionTitle の文字数が13文字以上の場合、font-sizeを小さくする
        const bigs = document.querySelectorAll(".big");
        bigs.forEach(big => {
            if (big.textContent.length >= 13) {
                big.classList.add("smallFont");
            }
        });

        const sectionTitles = document.querySelectorAll(".sectionTitle");
        sectionTitles.forEach(sectionTitle => {
            if (sectionTitle.textContent.length >= 13) {
                sectionTitle.classList.add("smallFont");
            }
        });
    </script>
</body>

</html>
