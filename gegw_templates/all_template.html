<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全カード | ハイスト人物図鑑</title>
    <link rel="stylesheet" href="../../css/textbook/gegw_common.css">
    <link rel="stylesheet" href="../../css/textbook/all_template.css">
</head>
<body>
    <main>
        <div class="pageArea">
            {page_divs}
        </div>
    </main>
    <div class="controls">
        <input type="button" value="ダウンロード" id="downloadButton">
        <div id="downloadStatus"><span>ダウンロード開始</span></div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/dist/dom-to-image.min.js"></script>
<script src="../../js/download.js"></script>
<script src="../../js/adjust-size.js"></script>
<script>
    const images = document.querySelectorAll('img');
    images.forEach(img => {
        img.addEventListener('error', () => {
            console.log(img.src);
            img.src = '../../assets/images/textbook/common/errorGreen.webp';
        });

        // テンプレートでui を確かめるためにエラーを出力
        // img.src = '../../assets/images/textbook/common/errorGreen.webp';
    });

    
    // レーダーチャートの描画
    const centerX = 100;
    const centerY = 100;
    const maxRadius = 100;
    const maxValue = 5;

    const pages = document.querySelectorAll('.pages');
    pages.forEach(page => {
        const parametersElements = [
            page.querySelector('.param1-value'),
            page.querySelector('.param2-value'),
            page.querySelector('.param3-value'),
            page.querySelector('.param4-value'),
            page.querySelector('.param5-value'),
            page.querySelector('.param6-value'),
        ];

        const parameters = parametersElements.map(element => parseInt(element.textContent) || 1);

        parameters.forEach((value, index) => {
            if (value == maxValue) {
                parametersElements[index].classList.add('max-value');
            }
        });


        function calculatePoint(angle, value) {
            const radians = (angle * Math.PI) / 180;
            const radius = (value / maxValue) * maxRadius;
            const x = centerX + radius * Math.cos(radians);
            const y = centerY - radius * Math.sin(radians);
            return [x, y];
        }

        function updateRadarChart() {
            const angles = [0, 60, 120, 180, 240, 300].map(angle => 180 - (angle + 90));
            let pathData = "";
            let circles = "";

            angles.forEach((angle, index) => {
                const [x, y] = calculatePoint(angle, parameters[index]);
                pathData += `${index === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)} `;
                circles += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`;
            });

            // const [x, y] = calculatePoint(0, parameters[0]);
            // pathData += `L ${x.toFixed(1)} ${y.toFixed(1)}`;
            pathData += 'Z';

            page.querySelector('.data-path').setAttribute('d', pathData);
            page.querySelector('.data-points').innerHTML = circles;
        }

        updateRadarChart();
    });

    // 東軍だったらsidebarのclassにeastを追加
    const sidebars = document.querySelectorAll(".sidebar");
    sidebars.forEach(sidebar => {
        const alt = sidebar.querySelector("img").alt;
        if (alt.includes("東軍")) {
            sidebar.classList.add("east");
        }
    });

    // .dialogCharacterName のテキストから数字を除去
    const dialogCharacterNames = document.querySelectorAll(".dialogCharacterName");
    dialogCharacterNames.forEach(dialogCharacterName => {
        dialogCharacterName.textContent = dialogCharacterName.textContent.replace(/\d/g, '');
    });

    // .aboutArmor のテキストに「未定」が含まれていたら非表示
    const aboutArmors = document.querySelectorAll(".aboutArmor");
    aboutArmors.forEach(aboutArmor => {
        if (aboutArmor.textContent.includes("未定")) {
            aboutArmor.style.display = "none";
        }
    });

</script>
</html>
